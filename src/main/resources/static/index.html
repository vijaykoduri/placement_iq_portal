<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlacementIQ - Predict & Prepare</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-container">

    <div class="glass-panel auth-card fade-in-el text-center">
        <!-- Logo Header -->
        <div class="mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 55px; height: 55px;">
                <i class="bi bi-rocket-takeoff-fill fs-3"></i>
            </div>
            <h2 class="font-weight-extrabold text-primary m-0">PlacementIQ</h2>
            <p class="text-muted small mt-1">Placement Prediction & Interview Prep Platform</p>
        </div>

        <!-- Auth Tabs -->
        <ul class="nav nav-pills mb-4 justify-content-center" id="authTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active px-4 py-2 me-2 font-weight-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link px-4 py-2 font-weight-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="false">Register</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="authTabContent">
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                <form id="loginForm" class="text-start">
                    <div class="alert alert-danger d-none" id="errorAlert" role="alert"></div>
                    <div class="mb-3">
                        <label for="username" class="form-label font-weight-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="username" placeholder="Enter username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label for="password" class="form-label font-weight-semibold m-0">Password</label>
                            <a href="#" onclick="showForgotPasswordPanel()" class="small text-decoration-none text-primary">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" placeholder="Enter password" required autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5">Login Account</button>
                </form>

                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" class="text-start d-none mt-3">
                    <div class="alert alert-danger d-none" id="forgotErrorAlert" role="alert"></div>
                    <div class="alert alert-success d-none" id="forgotSuccessAlert" role="alert"></div>
                    <h6 class="font-weight-bold text-primary mb-3">Reset Account Password</h6>
                    <div class="mb-3">
                        <label for="forgotUsername" class="form-label font-weight-semibold">Username</label>
                        <input type="text" class="form-control" id="forgotUsername" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label for="forgotEmail" class="form-label font-weight-semibold">Email Address</label>
                        <input type="email" class="form-control" id="forgotEmail" placeholder="Enter registered email" required>
                    </div>
                    <div class="mb-3">
                        <label for="forgotNewPassword" class="form-label font-weight-semibold">New Password</label>
                        <input type="password" class="form-control" id="forgotNewPassword" placeholder="Enter new password" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-2">Reset Password</button>
                        <button type="button" onclick="hideForgotPasswordPanel()" class="btn btn-outline-secondary py-2">Cancel</button>
                    </div>
                </form>

                <div class="mt-4 text-center small text-secondary">
                    <p class="mb-1 text-muted">Demo Credentials:</p>
                    <span class="badge bg-light text-dark border">Student: student / student123</span>
                    <span class="badge bg-light text-dark border ms-1">Admin: admin / admin123</span>
                </div>
            </div>

            <!-- Register Form -->
            <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                <form id="registerForm" class="text-start">
                    <div class="alert alert-danger d-none" id="regErrorAlert" role="alert"></div>
                    <div class="alert alert-success d-none" id="regSuccessAlert" role="alert"></div>
                    <div class="mb-3">
                        <label for="regUsername" class="form-label font-weight-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="regUsername" placeholder="Create username" required autocomplete="username">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label font-weight-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="regEmail" placeholder="Enter email" required autocomplete="email">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label font-weight-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="regPassword" placeholder="Create password" required autocomplete="new-password">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="regRole" class="form-label font-weight-semibold">Select Role</label>
                        <select class="form-select" id="regRole">
                            <option value="STUDENT" selected>Student</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Auth JS -->
    <script src="js/auth.js"></script>
</body>
</html>
