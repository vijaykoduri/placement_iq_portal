server.port=8080

# H2 Database Settings (configured for MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:placementiqdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow H2 Console access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration Secrets
jwt.secret=9a4f2c8d3e6b1a7c5d9e2f4a6b8c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c
# 1 day expiration (in milliseconds)
jwt.expiration=86400000

# File Upload sizes (for resume PDF upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
